[build]
  publish = "public"
  command = "npm run build"

  [[redirects]]
    from = "/feed/"
    to = "/feed.xml"
    status = 200

  # Blog posts used to live under a language-coded path (/posts/ita/,
  # /posts/eng/) from when the blog was multilingual; URLs are now flat
  # (/posts/slug/). 301s preserve external backlinks and search ranking.
  # /posts/esp/ is included even though no post currently lives there, in
  # case any old external link to a Spanish post from that era still exists.
  [[redirects]]
    from = "/posts/ita/*"
    to = "/posts/:splat"
    status = 301
    force = true

  [[redirects]]
    from = "/posts/eng/*"
    to = "/posts/:splat"
    status = 301
    force = true

  [[redirects]]
    from = "/posts/esp/*"
    to = "/posts/:splat"
    status = 301
    force = true

  # No Content-Security-Policy here on purpose: a decade of posts embed
  # iframes/images from dozens of ad-hoc third-party hosts (Spotify,
  # YouTube, Bandcamp, old blogspot/tumblr/wordpress media...), so a CSP
  # would need constant upkeep or it'd start silently breaking old posts.
  # These headers are safe because they don't restrict content sources.
  [[headers]]
    for = "/*"
    [headers.values]
      X-Content-Type-Options = "nosniff"
      X-Frame-Options = "SAMEORIGIN"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Permissions-Policy = "geolocation=(), microphone=(), camera=()"

  # Fonts never change in place (a change means a new filename), so a
  # year-long immutable cache is safe. CSS/JS are deliberately excluded:
  # they keep the same filename across deploys (no content hash), so a
  # long cache there would serve stale styles/scripts until it expires.
  [[headers]]
    for = "/fonts/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  # Images are rarely overwritten under the same filename (a replacement
  # usually gets a new name), so a month-long cache trades a small,
  # acceptable staleness risk for materially faster repeat visits.
  [[headers]]
    for = "/img/*"
    [headers.values]
      Cache-Control = "public, max-age=2592000"

[dev]
  command = "npm start"

[build.environment]
  NODE_VERSION = "24"